# Prometheus scrape config for the WeCare platform.
# Targets are resolved by Docker DNS (container names) on the wecare-net network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # api-gateway sets a global "api" prefix, so /metrics lives under /api/metrics.
  - job_name: api-gateway
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:3001']

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ['order-service:3002']

  - job_name: product-service
    metrics_path: /metrics
    static_configs:
      - targets: ['product-service:3003']
